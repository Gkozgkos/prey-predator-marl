[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prey-predator-marl"
version = "0.1.0"
description = "Multi-agent reinforcement learning in a prey-predator gridworld"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "VG" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pygame>=2.5",
]

[project.optional-dependencies]
plots = [
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prey_predator"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]