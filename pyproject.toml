[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prey-predator-marl"
version = "0.1.0"
description = "Multi-agent RL prey-predator gridworld"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "pygame>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prey_predator"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]